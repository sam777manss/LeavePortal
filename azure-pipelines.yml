trigger:
  branches:
    include: [ frontend ]

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      displayName: Install .NET 10
      inputs:
        packageType: sdk
        version: 10.0.x

    - task: UseNode@1
      displayName: Install Node 20
      inputs:
        version: 20.x

    - script: |
        npm ci
        npm run build
      workingDirectory: frontend
      displayName: Build React

    - script: |
        mkdir -p backend/LeavePortal.API/wwwroot
        cp -r frontend/dist/* backend/LeavePortal.API/wwwroot/
      displayName: Copy React into wwwroot

    - script: dotnet publish backend/LeavePortal.API/LeavePortal.API.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/api
      displayName: Publish API

    - script: dotnet publish backend/LeavePortal.Functions/LeavePortal.Functions.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/func
      displayName: Publish Function

    - publish: $(Build.ArtifactStagingDirectory)/api
      artifact: api

    - publish: $(Build.ArtifactStagingDirectory)/func
      artifact: func

- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployAll
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy API + React to App Service
            inputs:
              azureSubscription: leaveportal-azure
              appType: webApp
              appName: leaveportal-api
              package: $(Pipeline.Workspace)/api

          - task: AzureCLI@2
            displayName: Deploy Function (Flex Consumption)
            inputs:
              azureSubscription: leaveportal-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd $(Pipeline.Workspace)/func
                zip -r ../func.zip .
                az functionapp deployment source config-zip -g leaveportal-rg -n leaveportal-functions --src ../func.zip